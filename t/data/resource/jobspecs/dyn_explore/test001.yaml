version: 1
resources:
  - type: chassis
    count: 1
    label: default
    with:
      - type: node
        count: 2
        exclusive: true
        with:
          - type: slot
            label: task
            count: 1
            with:
              - type: core
                count: 1
      - type: ssd
        count: 202
        exclusive: true
attributes:
  system:
    duration: 3600
tasks:
  - command: ["app"]
    slot: task
    count:
      per_slot: 1
